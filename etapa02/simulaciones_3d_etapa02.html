<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etapa 02 · Simulaciones 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: aula técnica, clara y segura; cada parte se explica sola en 3D.
   IDEA: un banco de pruebas de visión por computadora: escena 3D + lo que la cámara "ve".
   PICTURE: la escena 3D ocupa casi toda la pantalla; HUD con gráficos y la vista de la cámara.
   COLOUR and TYPE: azul marino de noche para la escena, azul/teal/naranja de la presentación; Inter.
   LAYOUT: pestañas arriba, escena a la izquierda, panel de ideas/controles/lecturas a la derecha. */
:root{color-scheme:light dark;--bg:light-dark(#f4f6fa,#0b1322);--ink:light-dark(#0f172a,#e5ecf6);--sub:light-dark(#475569,#9fb0c8);
  --card:light-dark(#ffffff,#121d31);--line:light-dark(#dbe3ee,#22314b);--acc:#2563eb;--navy:#0f2547}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.1px;white-space:nowrap}
header h1 span{color:#93c5fd;font-weight:500}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{background:rgba(255,255,255,.08);color:#dbeafe;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 14px;font:600 13px Inter,sans-serif;cursor:pointer;min-height:36px}
.tab:hover{background:rgba(255,255,255,.16)}
.tab.on{background:#fff;color:var(--navy);border-color:#fff}
.tab b{color:#f97316;margin-right:4px}
#pausa{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 12px;font:600 13px Inter,sans-serif;cursor:pointer;min-height:36px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
#escenario{position:relative;background:#0a1830;overflow:hidden;min-height:320px}
#escenario canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none;z-index:2}
.capa-etiquetas{position:absolute!important;inset:0;z-index:3}
.ayuda{position:absolute;right:14px;bottom:10px;z-index:4;color:#9fb0c8;font-size:12px;pointer-events:none}
aside{border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px;background:var(--card)}
aside h2{font-size:21px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--sub);margin:0 0 12px;font-size:14px}
.ideas{margin:0 0 14px;padding-left:18px}
.ideas li{margin:0 0 8px;font-size:14px}
.ideas b{color:light-dark(#1d4ed8,#93c5fd)}
.lecturas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.lecturas div{background:light-dark(#eef3fb,#0d1729);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lecturas span{display:block;color:var(--sub);font-size:12px}
.lecturas b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.controles{display:flex;flex-direction:column;gap:12px}
.ctl{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500}
.ctl>span{display:flex;justify-content:space-between;gap:8px}
.ctl output{color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.sw{flex-direction:row;align-items:center;gap:10px;cursor:pointer;min-height:32px}
.sw input{position:absolute;opacity:0}
.sw i{width:40px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked+i{background:var(--acc)}.sw input:checked+i::after{left:21px}
.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:9px 6px;font:600 13px Inter,sans-serif;cursor:pointer;min-height:40px}
.seg button.on{background:var(--acc);color:#fff}
.btn{border:1px solid var(--line);background:light-dark(#fff,#0d1729);color:var(--ink);border-radius:10px;padding:10px;font:600 13.5px Inter,sans-serif;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.csv{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px}
.csv-t{font-size:12px;color:var(--sub);padding:6px 10px;background:light-dark(#eef3fb,#0d1729)}
.csv table{width:100%;border-collapse:collapse;font:12.5px ui-monospace,Consolas,monospace}
.csv th,.csv td{padding:3px 10px;text-align:right;border-top:1px solid var(--line)}
.csv th{color:var(--sub);font-weight:600}
/* etiquetas dentro de la escena 3D */
.lbl{font:600 12px Inter,sans-serif;color:#fff;background:rgba(10,24,48,.86);padding:3px 8px;border-radius:7px;border-left:3px solid #fff;white-space:nowrap;pointer-events:none;transform:translateY(-4px)}
.lbl-grande{font-size:14px;padding:5px 10px}
.lbl-grande span{font-weight:400;font-size:12px;color:#cbd5e1}
.lbl-pred{border-style:dashed;opacity:.85}
.lbl-vel{font-size:12px;line-height:1.35;text-align:left}
.lbl-vel .pxs{color:#93c5fd}.lbl-vel .ok{color:#86efac}.lbl-vel .mal{color:#fca5a5}.lbl-vel .tenue{color:#94a3b8;font-weight:500}
.lbl.seguido{outline:2px solid #facc15}
.eje{font:700 13px Inter,sans-serif;color:#fff;background:rgba(10,24,48,.7);padding:1px 6px;border-radius:5px;border-left:3px solid}
.tick{font:500 11px Inter,sans-serif;color:#9fb0c8}
.lado{font:800 22px Inter,sans-serif;color:#5eead4;text-shadow:0 1px 3px #000}
.zona{font:500 11.5px Inter,sans-serif;color:#ccfbf1;background:rgba(13,148,136,.55);padding:2px 6px;border-radius:5px;white-space:nowrap}
body.rec header,body.rec aside,body.rec .ayuda{display:none}
body.rec main{grid-template-columns:1fr}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:60vh auto}body{overflow:auto}aside{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:600px){header h1{font-size:15px}.tab{padding:6px 10px;font-size:12px}}
@media(prefers-reduced-motion:reduce){.sw i,.sw i::after{transition:none}}
</style>
</head>
